<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/assets/ntg-logo.png?v=20260828" type="image/png">
  <title>My Picks — NTG Sports</title>
  <link rel="stylesheet" href="/static/style.css?v=20260828">
  <link rel="stylesheet" href="/static/app.css?v=20260828">
  <link rel="stylesheet" href="/static/brand.css?v=20260828">
  <link rel="stylesheet" href="/static/design.css?v=20260828">
  <link rel="stylesheet" href="/static/home-v2.css?v=20260828">
  <link rel="stylesheet" href="/static/ntg-system.css?v=20260828">
</head>
<body class="ntg-shell home-v2">
  <div class="app-shell">
    <header class="app-topbar dash-topbar">
      <div class="app-nav-row dash-nav-row">
        <a class="app-brand app-brand--lockup" href="/" aria-label="NTG Sports home">
          <img class="app-brand-logo app-brand-logo--dash" src="/static/assets/ntg-logo.png?v=20260828" alt="NTG Sports" width="56" height="56" />
        </a>
        <nav class="app-nav-primary dash-primary-nav" aria-label="Primary"></nav>
        <nav class="app-nav-links dash-utility-nav" aria-label="Account & tools"></nav>
      </div>
      <div class="dash-subnav">
        <div class="sport-pills dash-sport-pills" aria-label="Sports"></div>
      </div>
    </header>
    <main class="app-main dash-main">
      <header class="dash-page-header">
        <div>
          <h1>My Picks</h1>
          <p class="dash-page-kicker">Track saved games and player props from selection to result. Original lines stay as you saved them.</p>
        </div>
      </header>
      <div id="picks-summary" class="ntg-quick-filters" hidden></div>
      <div id="picks-filters" class="ntg-toolbar" hidden>
        <div class="ntg-quick-filters" role="tablist" aria-label="Pick status">
          <button type="button" class="sport-pill sport-pill-active" data-pick-status="all">All</button>
          <button type="button" class="sport-pill" data-pick-status="upcoming">Upcoming</button>
          <button type="button" class="sport-pill" data-pick-status="live">Live</button>
          <button type="button" class="sport-pill" data-pick-status="final">Final</button>
        </div>
        <div class="ntg-quick-filters" role="tablist" aria-label="Sport">
          <button type="button" class="sport-pill sport-pill-active" data-pick-sport="all">All sports</button>
          <button type="button" class="sport-pill" data-pick-sport="mlb">MLB</button>
          <button type="button" class="sport-pill" data-pick-sport="nfl">NFL</button>
        </div>
      </div>
      <div id="watchlist-body">
        <div class="ntg-skel" style="min-height:8rem" aria-label="Loading saved picks"></div>
      </div>
    </main>
  </div>
  <script src="/static/player_prop_modal.js?v=20260828"></script>
  <script src="/static/app.js?v=20260828"></script>
  <script src="/static/watchlist.js?v=20260828"></script>
</body>
</html>
