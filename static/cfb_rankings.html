<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/assets/ntg-logo.png?v=20260922" type="image/png">
  <title>CFB Power Rankings — NTG Sports</title>
  <link rel="stylesheet" href="/static/style.css?v=20260922">
  <link rel="stylesheet" href="/static/app.css?v=20260922">
  <link rel="stylesheet" href="/static/brand.css?v=20260922">
  <link rel="stylesheet" href="/static/design.css?v=20260922">
  <link rel="stylesheet" href="/static/home-v2.css?v=20260922">
  <link rel="stylesheet" href="/static/ntg-system.css?v=20260922">
  <link rel="stylesheet" href="/static/cfb_futures.css?v=20260922">
  <link rel="stylesheet" href="/static/power_rankings.css?v=20260922">
</head>
<body class="ntg-shell home-v2 board-cfb" data-sport="cfb">
  <div class="app-shell">
    <header class="app-topbar dash-topbar">
      <div class="app-nav-row dash-nav-row">
        <a class="app-brand app-brand--lockup" href="/" aria-label="NTG Sports home">
          <img class="app-brand-logo app-brand-logo--dash" src="/static/assets/ntg-logo.png?v=20260922" alt="NTG Sports" width="56" height="56" />
        </a>
        <nav class="app-nav-primary dash-primary-nav" aria-label="Primary"></nav>
        <nav class="app-nav-links dash-utility-nav" aria-label="Account & tools"></nav>
      </div>
      <div class="dash-subnav">
        <div class="sport-pills dash-sport-pills" aria-label="Sports"></div>
      </div>
      <div class="dash-sync-wrap">
        <div id="site-refresh-bar" class="site-refresh-bar dash-sync-text" aria-live="polite">Checking sync…</div>
        <div class="dash-progress" aria-hidden="true">
          <div id="dash-progress-fill" class="dash-progress-fill"></div>
        </div>
      </div>
    </header>

    <main class="app-main dash-main board-main">
      <header class="dash-page-header">
        <div>
          <h1>College football power rankings</h1>
          <p class="dash-page-kicker">Our FBS ratings. Offense and defense ranked out of every team on the list.</p>
        </div>
        <span class="dash-page-kicker" id="pr-meta">Loading rankings…</span>
      </header>

      <div class="slate-toolbar dash-toolbar">
        <button type="button" class="dash-btn dash-btn-ghost" id="model-relearn-btn" title="Rebuild winner picks from this season and the current power rankings">
          Model relearn
        </button>
        <span id="model-relearn-status" class="dash-page-kicker" aria-live="polite"></span>
      </div>

      <div class="error error-state hidden" id="pr-error"></div>
      <div class="loading empty-state" id="pr-loading">
        <div class="spinner"></div>
        <p>Rating FBS teams…</p>
      </div>

      <div class="content hidden" id="pr-content">
        <p class="pr-summary" id="pr-summary"></p>
        <div class="pr-toolbar">
          <label class="pr-field">Team
            <input id="pr-search" type="search" placeholder="Search teams" autocomplete="off" />
          </label>
          <label class="pr-field">Conference
            <select id="pr-group" aria-label="Conference"></select>
          </label>
          <span class="pr-count" id="pr-count"></span>
        </div>
        <section class="pr-missing-legend" id="pr-legend"></section>
        <div class="table-wrap">
          <table class="pr-table" id="pr-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Team</th>
                <th>Power</th>
                <th>Offense</th>
                <th>Defense</th>
                <th>Record</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="/static/app.js?v=20260922r"></script>
  <script src="/static/power_rankings.js?v=20260922s"></script>
</body>
</html>
