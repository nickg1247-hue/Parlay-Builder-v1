<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#05090d"><title>Under Construction | NTG Sports</title>
<style>
:root{color-scheme:dark;--amber:#ffad21}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#030609;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.site{position:relative;isolation:isolate;width:100%;height:100svh;overflow:hidden;background:#030609}
.frame{position:absolute;z-index:-3;left:50%;top:50%;width:max(100vw,200vh);aspect-ratio:2/1;transform:translate(-50%,-50%)}.backdrop{display:block;width:100%;height:100%}.shade{position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,rgba(0,3,7,.08),transparent 30% 72%,rgba(0,2,5,.28)),radial-gradient(ellipse at center,transparent 48%,rgba(0,2,5,.2) 115%);pointer-events:none}.scene-fx{position:absolute;z-index:2;inset:0;pointer-events:none}
.lamp-flash{position:absolute;top:42.8%;width:5.3%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);opacity:.03;background:radial-gradient(circle,rgba(255,253,218,1) 0 6%,rgba(255,190,54,.95) 18%,rgba(255,131,0,.48) 42%,rgba(255,113,0,.06) 65%,transparent 72%);mix-blend-mode:screen;animation:lamp 1.5s cubic-bezier(.4,0,.6,1) infinite}.lamp-left{left:35.9%}.lamp-right{left:63.6%;animation-delay:-.75s}
.brand{position:absolute;z-index:20;top:clamp(1rem,3vw,2rem);left:clamp(1rem,4vw,4rem);display:flex;align-items:center;gap:.7rem;color:#fff;text-decoration:none;font-size:.7rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 3px 14px #000}.brand img{width:40px;height:40px;filter:drop-shadow(0 4px 12px #000)}.status{position:absolute;z-index:20;top:clamp(1.3rem,3.4vw,2.3rem);right:clamp(1rem,4vw,4rem);display:flex;align-items:center;gap:.5rem;color:#d8dde1;font-size:.63rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;text-shadow:0 2px 8px #000}.status:before{content:"";width:7px;aspect-ratio:1;border-radius:50%;background:var(--amber);box-shadow:0 0 14px 3px rgba(255,153,16,.8);animation:status 1.8s ease-in-out infinite}
.weather{position:absolute;z-index:8;inset:0;width:100%;height:100%;pointer-events:none}.actions{position:absolute;z-index:20;left:50%;bottom:clamp(.8rem,2.3vh,1.5rem);display:flex;gap:.65rem;transform:translateX(-50%)}.action{display:flex;min-height:42px;align-items:center;justify-content:center;padding:.7rem 1rem;border:1px solid rgba(255,255,255,.25);border-radius:3px;color:#fff;background:rgba(3,7,10,.72);backdrop-filter:blur(10px);font-size:.65rem;font-weight:850;letter-spacing:.11em;text-decoration:none;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:.2s}.action:hover{border-color:var(--amber);background:rgba(20,14,7,.82);transform:translateY(-2px)}.action:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
@keyframes lamp{0%,43%,100%{opacity:.025;filter:saturate(.6) brightness(.65)}49%,72%{opacity:1;filter:saturate(1.35) brightness(1.16)}}@keyframes status{50%{opacity:.35;box-shadow:0 0 5px var(--amber)}}@media(max-aspect-ratio:1/1){.status span{display:none}.actions{bottom:.7rem;width:100%;justify-content:center}}@media(max-height:620px){.actions{bottom:.4rem}.action{min-height:36px;padding:.5rem .8rem}}@media(prefers-reduced-motion:reduce){.weather{display:none}.lamp-flash,.status:before{animation:none}.lamp-flash{opacity:.18}}
</style></head><body><main class="site"><div class="frame" id="sceneFrame"><img class="backdrop" src="/static/assets/ntg-under-construction-site-v5.png" alt="Wet nighttime construction site with cranes, machinery and an NTG Sports under-construction barricade"><div class="shade"></div><div class="scene-fx" aria-hidden="true"><span class="lamp-flash lamp-left"></span><span class="lamp-flash lamp-right"></span></div></div>
<a class="brand" href="/" aria-label="NTG Sports home"><img src="/static/ntg-logo-mark.svg" alt=""><span>NTG Sports</span></a><div class="status"><span>Building the next edge</span></div><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">NTG Sports — Under Construction</h1><canvas class="weather" id="weather" aria-hidden="true"></canvas><nav class="actions" aria-label="Page options"><a class="action" href="/">Return home</a><a class="action" href="/updates">View updates</a></nav></main>
<script>
(()=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const c=document.getElementById("weather"),ctx=c.getContext("2d"),frame=document.getElementById("sceneFrame");
let w=0,h=0,dpr=1,rain=[],rivers=[],beads=[],sparks=[],last=performance.now();
const rnd=(a,b)=>a+Math.random()*(b-a);
const weldSites=[
 {x:.835,y:.218,next:performance.now()+1800,on:false,end:0},
 {x:.900,y:.264,next:performance.now()+5100,on:false,end:0},
 {x:.765,y:.370,next:performance.now()+7900,on:false,end:0}
];
function resetRain(p,first=false){p.z=Math.random();p.x=rnd(-.05,1.05)*w;p.y=first?rnd(0,h):rnd(-.18,-.02)*h;p.speed=rnd(340,620)*(0.42+p.z*.8);p.len=rnd(1.5,4)+p.z*p.z*11;p.alpha=.018+p.z*p.z*.105;p.wind=rnd(-16,-6);p.width=.22+p.z*.62}
function size(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.width=w+"px";c.style.height=h+"px";ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.min(280,Math.max(125,Math.round(w*h/7000)));rain=Array.from({length:count},()=>{const p={};resetRain(p,true);return p});rivers=Array.from({length:8},()=>({x:rnd(.05,.95)*w,y:rnd(-h,h),speed:rnd(18,38),length:rnd(70,185),width:rnd(.7,1.8),curve:rnd(-10,10),alpha:rnd(.1,.22)}));beads=Array.from({length:12},()=>({x:rnd(.02,.98)*w,y:rnd(-h,h),speed:rnd(32,75),r:rnd(1.8,5.5),drift:rnd(-5,5),alpha:rnd(.08,.2)}))}
function lightAt(x,y){const nx=x/w,ny=y/h,pools=[[.36,.43,.16],[.64,.43,.16],[.5,.55,.09],[.78,.25,.1]];let v=.12;for(const q of pools){const dx=nx-q[0],dy=ny-q[1];v+=Math.exp(-(dx*dx+dy*dy)/(q[2]*q[2]))*.62}return Math.min(v,1)}
function drawRain(dt){const fr=frame.getBoundingClientRect();ctx.save();ctx.globalCompositeOperation="screen";ctx.lineCap="round";for(const p of rain){p.x+=p.wind*dt;p.y+=p.speed*dt;if(p.y>h+20||p.x<-.06*w)resetRain(p);const nx=(p.x-fr.left)/fr.width,ny=(p.y-fr.top)/fr.height;if(nx>.285&&nx<.715&&ny>.34)continue;const depth=.28+p.z*.46,a=p.alpha*lightAt(p.x,p.y)*depth;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.len*.045,p.y-p.len*.72);ctx.strokeStyle="rgba(185,220,238,"+a+")";ctx.lineWidth=Math.max(.2,p.width*.72);ctx.stroke()}ctx.restore()}
function drawLens(dt){ctx.save();ctx.lineCap="round";for(const r of rivers){r.y+=r.speed*dt;if(r.y-r.length>h){r.y=rnd(-.45,-.08)*h;r.x=rnd(.04,.96)*w;r.curve=rnd(-10,10)}const x2=r.x+r.curve;ctx.beginPath();ctx.moveTo(r.x,r.y-r.length);ctx.bezierCurveTo(r.x+r.curve*.15,r.y-r.length*.72,r.x-r.curve*.35,r.y-r.length*.28,x2,r.y);ctx.strokeStyle="rgba(0,10,16,"+(r.alpha*.42)+")";ctx.lineWidth=r.width+2.2;ctx.stroke();ctx.beginPath();ctx.moveTo(r.x-.65,r.y-r.length);ctx.bezierCurveTo(r.x+r.curve*.15-.65,r.y-r.length*.72,r.x-r.curve*.35-.65,r.y-r.length*.28,x2-.65,r.y);ctx.strokeStyle="rgba(218,239,248,"+r.alpha+")";ctx.lineWidth=Math.max(.45,r.width*.45);ctx.stroke();ctx.beginPath();ctx.ellipse(x2,r.y,Math.max(2.2,r.width*1.8),Math.max(3.8,r.width*2.7),0,0,Math.PI*2);ctx.strokeStyle="rgba(205,232,244,"+(r.alpha*.9)+")";ctx.lineWidth=.75;ctx.stroke();ctx.beginPath();ctx.arc(x2-1,r.y-1.5,.7,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,"+(r.alpha*1.5)+")";ctx.fill()}for(const b of beads){b.y+=b.speed*dt;b.x+=b.drift*dt;if(b.y-b.r>h){b.y=rnd(-.25,-.03)*h;b.x=rnd(.02,.98)*w}ctx.beginPath();ctx.ellipse(b.x,b.y,b.r*.72,b.r,0,0,Math.PI*2);ctx.strokeStyle="rgba(205,232,244,"+b.alpha+")";ctx.lineWidth=.65;ctx.stroke();ctx.beginPath();ctx.arc(b.x-b.r*.2,b.y-b.r*.3,Math.max(.35,b.r*.12),0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,"+(b.alpha*1.6)+")";ctx.fill()}ctx.restore()}
function point(site){const r=frame.getBoundingClientRect();return{x:r.left+r.width*site.x,y:r.top+r.height*site.y}}
function sparksAt(x,y,n){for(let i=0;i<n;i++)sparks.push({x,y,vx:rnd(-75,75),vy:rnd(35,150),life:rnd(.3,.85),age:0,size:rnd(.5,1.35)})}
function drawWeld(now,dt){for(const site of weldSites){if(!site.on&&now>site.next){site.on=true;site.end=now+rnd(550,1250)}if(site.on&&now>site.end){site.on=false;site.next=now+rnd(5500,12500)}if(site.on){const p=point(site);if(Math.random()>.27){const pulse=rnd(.38,1),radius=site===weldSites[0]?78:55,g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);g.addColorStop(0,"rgba(255,255,255,"+pulse+")");g.addColorStop(.07,"rgba(175,237,255,"+(pulse*.9)+")");g.addColorStop(.32,"rgba(70,180,255,"+(pulse*.2)+")");g.addColorStop(1,"rgba(25,105,195,0)");ctx.fillStyle=g;ctx.fillRect(p.x-radius,p.y-radius,radius*2,radius*2);if(Math.random()>.58)sparksAt(p.x,p.y,Math.floor(rnd(2,5)))}}}for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.age+=dt;if(s.age>s.life){sparks.splice(i,1);continue}s.vy+=245*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;const a=1-s.age/s.life;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*.016,s.y-s.vy*.016);ctx.strokeStyle="rgba(255,185,65,"+a+")";ctx.lineWidth=s.size;ctx.stroke()}}
function loop(now){const dt=Math.min((now-last)/1000,.034);last=now;ctx.clearRect(0,0,w,h);drawRain(dt);drawWeld(now,dt);requestAnimationFrame(loop)}
addEventListener("resize",size,{passive:true});size();requestAnimationFrame(loop)})();
</script></body></html>
