<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/assets/ntg-logo.png?v=20260814" type="image/png">
  <title>NHL Game — NTG Sports</title>
  <link rel="stylesheet" href="/static/style.css?v=20260814">
  <link rel="stylesheet" href="/static/app.css?v=20260816">
  <link rel="stylesheet" href="/static/brand.css?v=20260814">
  <link rel="stylesheet" href="/static/design.css?v=20260814">
  <link rel="stylesheet" href="/static/home-v2.css?v=20260814">
  <link rel="stylesheet" href="/static/ntg-system.css?v=20260821">
  <style>
    .nhl-markets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0 8px; }
    .nhl-market { padding: 16px; }
    .nhl-market h2 { margin: 0 0 6px; font-size: 0.95rem; }
    .nhl-market .nhl-pick { font-size: 1.25rem; font-weight: 650; margin: 0 0 8px; }
    .nhl-market p { margin: 0 0 6px; }
    .nhl-scorelines { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .nhl-scoreline { padding: 8px 10px; }
    @media (max-width: 800px) { .nhl-markets { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="ntg-shell home-v2 game-page-bg" data-sport="nhl">
  <div class="game-page-wash" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="app-topbar dash-topbar">
      <div class="app-nav-row dash-nav-row">
        <a class="app-brand app-brand--lockup" href="/" aria-label="NTG Sports home">
          <img class="app-brand-logo app-brand-logo--dash" src="/static/assets/ntg-logo.png?v=20260814" alt="NTG Sports" width="56" height="56" />
        </a>
        <nav class="app-nav-primary dash-primary-nav" aria-label="Primary"></nav>
        <nav class="app-nav-links dash-utility-nav" aria-label="Account & tools"></nav>
      </div>
      <div class="dash-subnav">
        <div class="sport-pills dash-sport-pills" aria-label="Sports"></div>
      </div>
      <div class="dash-sync-wrap">
        <div id="site-refresh-bar" class="site-refresh-bar dash-sync-text" aria-live="polite">Checking sync…</div>
        <div class="dash-progress" aria-hidden="true">
          <div id="dash-progress-fill" class="dash-progress-fill"></div>
        </div>
      </div>
    </header>

    <div id="live-ticker" class="ticker-placeholder" aria-label="Live scores"></div>

    <main class="app-main dash-main">
      <p class="dash-page-kicker"><a href="/nhl">← NHL slate</a> · <a href="/nhl/board">Board</a></p>
      <div id="game-loading" class="ntg-skel-stack" aria-busy="true" aria-label="Loading game">
        <div class="ntg-skel ntg-skel--header"></div>
        <div class="ntg-skel ntg-skel--card"></div>
      </div>
      <div id="game-error" class="error-state hidden"></div>
      <div id="game-content" class="hidden"></div>
    </main>
  </div>
  <script src="/static/app.js?v=20260929nhl"></script>
  <script src="/static/nhl_game.js?v=20260929nhl"></script>
</body>
</html>
