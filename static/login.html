<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/assets/ntg-logo.png?v=20260821" type="image/png">
  <title>Sign in — NTG Sports</title>
  <link rel="stylesheet" href="/static/style.css?v=20260821">
  <link rel="stylesheet" href="/static/app.css?v=20260821">
  <link rel="stylesheet" href="/static/brand.css?v=20260821">
  <link rel="stylesheet" href="/static/ntg-system.css?v=20260821">
  <link rel="stylesheet" href="/static/auth.css?v=20260821">
</head>
<body class="ntg-auth">
  <div class="auth-wrap login-wrap">
    <a class="auth-brand" href="/" aria-label="NTG Sports home">
      <img src="/static/assets/ntg-logo.png?v=20260821" alt="" width="56" height="56" />
      <span>NTG Sports</span>
    </a>
    <div class="auth-card login-card ntg-card">
      <h1>Sandbox sign in</h1>
      <p>Sign in to access Sandbox — advanced boards, model lab, and factor tuning.</p>
      <form id="login-form" autocomplete="on">
        <div class="auth-field login-field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="auth-field login-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="login-error auth-error" role="alert"></div>
        <button type="submit" class="login-submit auth-submit ntg-btn ntg-btn-primary" id="login-btn">Sign in</button>
      </form>
      <a class="auth-back login-back" href="/">← Back to home</a>
    </div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next") || "/sandbox";
      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("login-error");
      const btn = document.getElementById("login-btn");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        errorEl.textContent = "";
        btn.disabled = true;
        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value,
              password: document.getElementById("password").value,
            }),
          });
          if (!res.ok) {
            const body = await res.json().catch(function () { return {}; });
            errorEl.textContent = body.detail || "Sign in failed";
            return;
          }
          window.location.href = next;
        } catch (err) {
          errorEl.textContent = "Network error — try again";
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
