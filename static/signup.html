<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/assets/ntg-logo.png?v=20260821" type="image/png">
  <title>Sign up — NTG Sports</title>
  <link rel="stylesheet" href="/static/style.css?v=20260821">
  <link rel="stylesheet" href="/static/app.css?v=20260821">
  <link rel="stylesheet" href="/static/brand.css?v=20260821">
  <link rel="stylesheet" href="/static/ntg-system.css?v=20260821">
  <link rel="stylesheet" href="/static/auth.css?v=20260821">
</head>
<body class="ntg-auth">
  <div class="auth-wrap">
    <a class="auth-brand" href="/" aria-label="NTG Sports home">
      <img src="/static/assets/ntg-logo.png?v=20260821" alt="" width="56" height="56" />
      <span>NTG Sports</span>
    </a>
    <div class="auth-card ntg-card">
      <h1>Create account</h1>
      <p>Sign up with email to unlock player props. Games and news stay free without an account.</p>
      <form id="signup-form" autocomplete="on">
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="auth-field">
          <label for="password2">Confirm password</label>
          <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div id="signup-error" class="auth-error" role="alert"></div>
        <div id="signup-note" class="auth-note hidden" role="status"></div>
        <div class="auth-field auth-terms">
          <label class="auth-terms-label">
            <input id="accept-terms" name="accept_terms" type="checkbox" required>
            <span>I agree to the <a href="/terms" target="_blank" rel="noopener">Terms of Service</a>
              and <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</span>
          </label>
        </div>
        <button type="submit" class="auth-submit ntg-btn ntg-btn-primary" id="signup-btn">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/signin">Sign in</a></p>
      <a class="auth-back" href="/">← Back to home</a>
    </div>
  </div>
  <script src="/static/pwa.js?v=20260821"></script>
  <script src="/static/auth.js?v=2"></script>
  <script>
    initSignUpPage();
  </script>
</body>
</html>
